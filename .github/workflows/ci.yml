name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # packages/database/prisma.config.ts resolves DATABASE_ADMIN_URL through
  # prisma/config `env()`, so the variable must exist for the config module to
  # load at all. `prisma generate` never opens a database connection; this is an
  # ephemeral, non-secret placeholder matching compose.yaml, not a credential.
  # The Database Integration job overrides it via TEST_DATABASE_ADMIN_URL for
  # `prisma migrate deploy` only.
  DATABASE_ADMIN_URL: postgresql://crm:crm@localhost:5432/crm?schema=public

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal prerequisites
        run: pnpm --filter @crm/contracts --filter @crm/database build

      - name: Typecheck
        run: pnpm typecheck

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal prerequisites
        run: pnpm --filter @crm/contracts --filter @crm/database build

      - name: Check generated contracts
        run: pnpm contracts:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    # The only job that runs every workspace suite; measured 28s locally, so 45
    # minutes keeps ~100x headroom on slower runners while still bounding a hang.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal prerequisites
        run: pnpm --filter @crm/contracts --filter @crm/database build

      - name: Run workspace tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build clean runtime image
        run: >-
          docker build --no-cache
          --build-arg NEXT_PUBLIC_API_ORIGIN=https://app.example.invalid
          -t crm-ci:trial .

      - name: Verify offline runtime pnpm
        run: docker run --rm --network none crm-ci:trial pnpm --version

      - name: Start migration database and isolated network
        env:
          COMPOSE_PROJECT_NAME: crm-ci-build
        run: |
          docker compose up -d --wait postgres
          docker network create --internal crm-ci-migrations
          docker network connect --alias postgres crm-ci-migrations "$(docker compose ps -q postgres)"

      - name: Verify migrations without external network access
        run: |
          docker run --rm --name crm-ci-migrate --network crm-ci-migrations \
            -e DATABASE_ADMIN_URL=postgresql://crm:crm@postgres:5432/crm?schema=public \
            crm-ci:trial pnpm --filter @crm/database prisma:migrate:deploy
          docker run --rm --name crm-ci-migrate --network crm-ci-migrations \
            -e DATABASE_ADMIN_URL=postgresql://crm:crm@postgres:5432/crm?schema=public \
            crm-ci:trial pnpm --filter @crm/database prisma:migrate:deploy | tee /tmp/crm-ci-migrations-repeat.log
          grep -F "No pending migrations to apply" /tmp/crm-ci-migrations-repeat.log

      - name: Show migration database logs on failure
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: crm-ci-build
        run: docker compose logs --no-color postgres

      - name: Clean up temporary migration resources
        if: always()
        env:
          COMPOSE_PROJECT_NAME: crm-ci-build
        run: |
          if docker container inspect crm-ci-migrate >/dev/null 2>&1; then
            docker rm -f crm-ci-migrate
          fi
          docker compose down -v
          if docker network inspect crm-ci-migrations >/dev/null 2>&1; then
            docker network rm crm-ci-migrations
          fi

  database-integration:
    name: Database Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Build database package
        run: pnpm --filter @crm/database build

      - name: Run database integration tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://crm:crm@localhost:5432/crm?schema=public
          TEST_DATABASE_URL: postgresql://crm_app:crm_app@localhost:5432/crm?schema=public
        run: pnpm --filter @crm/database test:integration

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs --no-color postgres

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

  critical-api-e2e:
    name: Critical API E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Build internal prerequisites
        run: pnpm --filter @crm/contracts --filter @crm/database build

      - name: Deploy migrations
        env:
          DATABASE_ADMIN_URL: postgresql://crm:crm@localhost:5432/crm?schema=public
        run: pnpm --filter @crm/database prisma:migrate:deploy

      - name: Run Critical API E2E
        env:
          DATABASE_ADMIN_URL: postgresql://crm:crm@localhost:5432/crm?schema=public
          TEST_DATABASE_ADMIN_URL: postgresql://crm:crm@localhost:5432/crm?schema=public
          TEST_DATABASE_URL: postgresql://crm_app:crm_app@localhost:5432/crm?schema=public
        run: pnpm --filter @crm/api test:e2e:critical

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs --no-color postgres

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
